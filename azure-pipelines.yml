trigger:
- main

pool:
  name: "agentcicd"

stages:
  - stage: Build_Image
    displayName: Build Docker Image
    jobs:
      - job: Build_Image
        displayName: Build the Youtube Lite Image
        steps:
          - task: Docker@2
            displayName: Build the Image
            inputs:
              containerRegistry: 'docker'
              repository: '9881665778/youtube_lite'
              command: 'build'
              Dockerfile: '**/Dockerfile'
              tags: |
                latest

  - stage: Scan_Image
    displayName: Scan Docker Image
    dependsOn: Build_Image
    jobs:
    - job: Scan_Image
      displayName: Scan with Trivy
      steps:
        - script: |
            echo "Checking system architecture..."
            uname -a
            uname -m
          displayName: Check System Info

        - script: |
            echo "Installing Trivy..."
            curl -L -o trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.49.1/trivy_0.49.1_Linux-ARM64.tar.gz
            tar -zxvf trivy.tar.gz
            chmod +x trivy
            ./trivy --version
          displayName: Install Trivy

        - script: |
            ./trivy image 9881665778/youtube_lite:latest || true
          displayName: Run Trivy Scan




  - stage: Push_Image
    displayName: Push Docker Image
    dependsOn: Scan_Image
    jobs:
      - job: Push_Image
        displayName: Push to Docker Hub
        steps:
          - task: Docker@2
            displayName: Push the Image
            inputs:
              containerRegistry: 'docker'
              repository: '9881665778/youtube_lite'
              command: 'push'
              tags: |
                latest

  - stage: Deploy_Container
    displayName: Deploy Container from Docker Image
    dependsOn: Push_Image
    jobs:
      - job: Deploy_Container
        displayName: Run Docker Container
        steps:
          - script: |
              docker pull 9881665778/youtube_lite:latest
              docker run -d -p 80:80 --name youtube_lite_container 9881665778/youtube_lite:latest
            displayName: Run Docker Container
